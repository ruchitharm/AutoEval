<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoEval</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="center-card" style="max-width: 760px;">
            <div class="right-panel" style="padding: 56px 32px; min-height: 680px;">
                <div class="form-card" style="width:100%; max-width: 520px;">
                    <h2 class="form-title">Login</h2>
                    <p class="form-subtitle">Enter your credentials to continue</p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="flash-message {% if category == 'error' %}error-message{% endif %}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" name="username" id="username" placeholder="Enter your username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn">Login</button>
                    </form>

                    <div class="auth-links">
                        Don’t have an account?
                        <a href="{{ url_for('register') }}">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
