<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AutoEval</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="dashboard-wrapper" style="width:100%;">
            <div class="topbar">
                <div class="logo-text">AUTOEVAL DASHBOARD</div>
                <div class="nav-links">
                    <a href="{{ url_for('dashboard') }}" class="active">Dashboard</a>
                    <a href="{{ url_for('upload') }}">Upload</a>
                    <a href="{{ url_for('history') }}">History</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                </div>
            </div>

            <div class="section-card" style="padding-top: 70px; padding-bottom: 70px;">
                <h1 class="section-title">Welcome to AutoEval</h1>
                <p class="section-text">
                    A neat and attractive evaluation system with centered alignment and smooth UI.
                </p>

                <div class="actions-row">
                    <a href="{{ url_for('upload') }}" class="btn">Upload Answer Sheet</a>
                    <a href="{{ url_for('history') }}" class="btn btn-secondary">View History</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
